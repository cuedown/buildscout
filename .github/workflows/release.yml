name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package BuildScout.app
        run: |
          chmod +x scripts/package_app.sh
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="dev"; fi
          scripts/package_app.sh "$VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildScout-macOS
          path: dist/BuildScout-macOS.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/BuildScout-macOS.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/BuildScout-macOS.zip --generate-notes
          fi
